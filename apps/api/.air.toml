# air hot-reload config for the Go API (apps/api).
# Run via `make dev-api` (host workflow) — rebuilds + restarts ./cmd/api on save.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go"]
  exclude_dir = ["tmp", "internal/sqlc/generated"]
  exclude_regex = ["_test\\.go"]
  delay = 200
  kill_delay = "2s"
  stop_on_error = true
  send_interrupt = true

[misc]
  clean_on_exit = true

[log]
  time = true

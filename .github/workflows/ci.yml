# ABOUTME: PR validation workflow — runs on every PR to staging/main and on push to those branches.
# ABOUTME: Uses Bun for JavaScript workspace package management and scripts.
# ABOUTME: web-typecheck is non-blocking (continue-on-error: true) due to pre-existing TypeScript
# ABOUTME: errors in apps/web (integrations page, issue-detail-view) caused by SDK module-resolution
# ABOUTME: issues. Once those are fixed, remove continue-on-error and move the step to required.
name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Go API — build + unit tests + contract guards that need no services
  # ---------------------------------------------------------------------------
  go:
    name: Go API (build + tests + contract guards)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Match go.mod toolchain version
          go-version: "1.25.11"
          cache-dependency-path: apps/api/go.sum

      - name: Build Go API
        working-directory: apps/api
        run: go build ./...

      - name: Run Go unit tests
        working-directory: apps/api
        run: go test ./internal/...

      - name: Set up Node (for contract guard scripts)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: OpenAPI coverage guard
        run: node scripts/check-openapi-coverage.mjs

      - name: OpenAPI strict-stub guard
        run: node scripts/check-go-openapi-generated.mjs

      - name: sqlc generated-query guard
        run: node scripts/check-sqlc-generated.mjs

      - name: Migration filename guard
        run: node scripts/check-migrations.mjs

      - name: API Dockerfile shape guard
        run: bash infra/docker/api.Dockerfile.test.sh

      - name: ECS task-definition shape guard
        run: node scripts/check-ecs-task-definitions.mjs

      - name: ECS task-definition rendering guard
        run: node scripts/render-ecs-task-definitions.test.mjs

      - name: Deploy-script syntax guard
        run: |
          bash -n scripts/preflight.sh
          sh -n scripts/deploy-ecs.sh
          sh -n scripts/configure-ecs-autoscaling.sh
          sh -n scripts/reset-demo.sh
          node scripts/check-deploy-scripts.mjs
          node scripts/check-reset-demo-env.mjs

      - name: Smoke-script shape guard
        run: |
          sh -n scripts/smoke-prod.sh
          node scripts/check-smoke-script.mjs

  # ---------------------------------------------------------------------------
  # Job 2: Node — Biome lint, web architecture guards, Vitest unit tests
  # ---------------------------------------------------------------------------
  node:
    name: Node (lint + architecture guards + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint + format check
        run: bun run lint

      - name: Web API-route empty guard
        run: bun run web-api-empty

      - name: Web SDK-usage guard
        run: node scripts/check-web-sdk-usage.mjs

      - name: Web runtime-boundary guard
        run: node scripts/check-web-runtime-boundaries.mjs

      - name: Vitest unit tests (sdk, cli, mcp-server)
        # Runs vitest for all packages that have tests and currently pass.
        # @exponential/web vitest is excluded here because its test files share
        # the pre-existing TypeScript errors that block compilation; they are
        # covered by the non-blocking web-typecheck job below.
        run: TZ=Asia/Seoul bun run test --filter '!@exponential/web'

  # ---------------------------------------------------------------------------
  # Job 3 (NON-BLOCKING): TypeScript typecheck for the full monorepo.
  #
  # This job is intentionally set to continue-on-error: true because
  # apps/web currently has pre-existing TypeScript syntax errors in:
  #   - src/app/(app)/settings/integrations/page.tsx
  #   - src/components/issue-detail-view.tsx
  #   - tests/integrations-view.test.tsx
  # and @namuh-eng/expn-cli / @exponential/mcp-server have SDK module-resolution
  # errors stemming from the same root cause.
  #
  # ACTION REQUIRED: once the pre-existing SDK resolution issue is fixed and
  # `bun run typecheck` exits 0 across the monorepo, remove `continue-on-error`
  # from this job so it becomes a required gate.
  # ---------------------------------------------------------------------------
  web-typecheck:
    name: Web typecheck (non-blocking — pre-existing SDK errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck (full monorepo)
        run: bun run typecheck

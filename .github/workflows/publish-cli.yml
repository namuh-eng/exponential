# ABOUTME: Manual / emergency publish workflow with an explicit dry-run toggle.
# For normal versioned releases use scripts/tag-release.sh → release.yml instead.
name: Publish CLI packages (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish with --dry-run"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish SDK and CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify SDK
        run: |
          bun run --filter @namuh-eng/expn-sdk typecheck
          bun run --filter @namuh-eng/expn-sdk test
          bun run --filter @namuh-eng/expn-sdk build

      - name: Verify CLI
        run: |
          bun run --filter @namuh-eng/expn-cli typecheck
          bun run --filter @namuh-eng/expn-cli test
          bun run --filter @namuh-eng/expn-cli build

      - name: Pack release tarballs
        run: |
          node scripts/pack-release-tarballs.mjs .release
          ls -la .release

      - name: Publish release tarballs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          publish_args="--access public"
          if [ "$DRY_RUN" = "true" ]; then
            publish_args="$publish_args --dry-run"
          fi

          npm publish .release/namuh-eng-expn-sdk-*.tgz $publish_args
          npm publish .release/namuh-eng-expn-cli-*.tgz $publish_args
